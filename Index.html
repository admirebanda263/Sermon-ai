<!DOCTYPE html>
<html lang="en">

  <!-- Link CSS File -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">SermonAI</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <section class="hero">

  <h1>Create Powerful Sermons With AI</h1>

  <p>
    Generate inspiring sermons instantly from Bible verses,
    topics, themes, or prayer points using AI technology.
  </p>

  <!-- Input -->
  <textarea id="prompt"
    placeholder="Enter Bible verse or sermon topic..."></textarea>

  <!-- Button -->
  <button class="btn" onclick="generateSermon()">
    Generate Sermon
  </button>

  <!-- Output -->
  <div id="result"></div>

</section>

<script>
async function generateSermon() {

  const prompt = document.getElementById("prompt").value;

  const response = await fetch("http://localhost:3000/generate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt })
  });

  const data = await response.json();

  document.getElementById("result").innerText = data.reply;
}
</script>

</body>
